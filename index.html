<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alibaug Trip Feedback</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #2193b0, #6dd5ed);
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  background: white;
  width: 360px;
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.subtitle {
  color: #666;
}

.option {
  background: #f2f2f2;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.option:hover {
  background: #dbeafe;
}

.option.selected {
  background: #2563eb;
  color: white;
}

textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
<h1>🏖 Alibaug Trip Feedback</h1>
<p class="subtitle">Quick, fun & honest 😄</p>

<p style="font-size: 13px; color: #444; margin-top: 10px;">
  ही feedback पूर्णपणे anonymous आहे. तुमचे नाव कुठेही save होणार नाही — कृपया प्रामाणिक उत्तर द्या 😊<br>
  ही माहिती आम्ही future trips सुधारण्यासाठी वापरणार आहोत.
</p>

<div id="card"></div>

<button id="nextBtn">Next →</button>
</div>


<script>
// FINAL 12 MCQ QUESTIONS
const questions = [
  {
    key: "overall_experience",
    text: "How was your overall trip experience?",
    options: ["🌟 Excellent", "🙂 Good", "😐 Average", "😞 Poor"]
  },
  {
    key: "planning",
    text: "How satisfied were you with trip planning & coordination?",
    options: ["🌟 Very satisfied", "🙂 Satisfied", "😐 Neutral", "😞 Dissatisfied"]
  },
  {
    key: "pre_info",
    text: "How clear was the information shared before the trip?",
    options: ["✅ Very clear", "🙂 Clear", "😐 Somewhat", "❌ Confusing"]
  },
  {
    key: "transport",
    text: "How was the transportation arrangement?",
    options: ["🚌 Comfortable", "🙂 Fine", "😐 Okay", "😬 Tiring"]
  },
  {
    key: "stay",
    text: "How was the camping / tent stay experience?",
    options: ["🔥 Amazing", "🙂 Good", "😐 Okay", "😅 Not comfortable"]
  },
  {
    key: "promise",
    text: "Did the arrangements match what was promised?",
    options: ["✅ Yes, completely", "🙂 Mostly", "😐 Somewhat", "❌ No"]
  },
  {
    key: "itinerary",
    text: "How well was the itinerary managed?",
    options: ["⏱ Perfect", "🙂 Good", "😐 Okay", "😞 Poor"]
  },
  {
    key: "activities",
    text: "How enjoyable were sightseeing & beach activities?",
    options: ["🌊 Loved it", "🙂 Enjoyed", "😐 Average", "😞 Boring"]
  },
  {
    key: "pace",
    text: "Was the pace of the trip comfortable?",
    options: ["👌 Perfect", "🙂 Fine", "😐 Little rushed", "😫 Too tiring"]
  },
  {
    key: "safety",
    text: "Did you feel safe & supported during the trip?",
    options: ["🛡 Very safe", "🙂 Safe", "😐 Okay", "❌ Unsafe"]
  },
  {
    key: "value",
    text: "How was the value for money?",
    options: ["💰 Worth it", "🙂 Fair", "😐 Average", "❌ Not worth"]
  },
  {
    key: "recommend",
    text: "Would you recommend Let’s Firuya to others?",
    options: ["✅ Definitely", "🙂 Maybe", "🤔 Not sure", "❌ No"]
  }
];

// VARIABLES
let current = 0;
let answers = {};

const card = document.getElementById("card");
const nextBtn = document.getElementById("nextBtn");

// INITIAL RENDER
renderQuestion();

function renderQuestion() {
  const q = questions[current];
  card.innerHTML = `<h3>${q.text}</h3>`;

  q.options.forEach(opt => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = opt;

    div.onclick = () => {
      document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
      div.classList.add("selected");
      answers[q.key] = opt;
    };

    card.appendChild(div);
  });
}

// NEXT BUTTON
nextBtn.onclick = () => {
  if (!answers[questions[current].key]) return;

  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    showTextQuestions();
  }
};

// FINAL 3 TEXT QUESTIONS
function showTextQuestions() {
  card.innerHTML = `
    <h3>What did you like most about this trip?</h3>
    <textarea id="like" rows="3" placeholder="Your favorite moments..."></textarea>

    <h3>What can we improve in future trips?</h3>
    <textarea id="improve" rows="3" placeholder="Your suggestions..."></textarea>

    <h3>Any additional comments?</h3>
    <textarea id="comments" rows="3" placeholder="Anything else you'd like to add..."></textarea>
  `;
  nextBtn.innerText = "Submit 🚀";
  nextBtn.onclick = submitData;
}

// GOOGLE SHEETS API
const API_URL = "https://script.google.com/macros/s/AKfycbwco6Hcgyz6r0JdWBv8PZcDtoC1JdUkbAjZqnoKTDiyz4FAZIU0nWNVFpYqIRRFMr7nTA/exec";

function submitData() {
  answers.like = document.getElementById("like").value;
  answers.improve = document.getElementById("improve").value;
  answers.comments = document.getElementById("comments").value;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(answers)
  })
  .then(() => {
    card.innerHTML = "<h2>🎉 Feedback saved. Thank you!</h2>";
    nextBtn.style.display = "none";
  })
  .catch(() => {
    alert("❌ Something went wrong. Please try again.");
  });
}
</script>

</body>
</html>
